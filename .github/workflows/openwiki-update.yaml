name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 5"

permissions:
  contents: write
  pull-requests: write

jobs:
  # GitHub cron cannot express "every other week", so the weekly schedule is
  # gated here on ISO week parity. Manual dispatch always runs.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.parity.outputs.run }}
    steps:
      - name: Check ISO week parity
        id: parity
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 10# forces base-10; date +%V emits 08/09, which bash reads as
          # invalid octal without it.
          week=$(( 10#$(date -u +%V) % 2 ))
          if [ "$week" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Odd ISO week; skipping this run."
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install OpenWiki
        run: npm install --global openwiki

      - name: Pick best model from openrouter-model-list
        # models-openwiki.json is score-sorted; take the top sanity_ok model.
        run: |
          MODEL=$(curl -sf https://raw.githubusercontent.com/smoochy/openrouter-model-list/main/models-openwiki.json \
            | jq -r '[.models[] | select(.sanity_ok)][0].id // empty')
          if [ -z "$MODEL" ]; then
            echo "No sanity_ok model in models-openwiki.json" >&2
            exit 1
          fi
          echo "Using model: $MODEL"
          echo "OPENWIKI_MODEL_ID=$MODEL" >> "$GITHUB_ENV"

      - name: Run OpenWiki
        # --update also handles the first run for code docs when env vars are set.
        run: openwiki code --update --print
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: ${{ env.OPENWIKI_MODEL_ID }}
          # OpenRouter free tier allows 16 requests/min; retry through 429s
          # instead of dying on the first one.
          OPENWIKI_PROVIDER_RETRY_ATTEMPTS: "10"
          # LangSmith key belongs to the EU region; without this endpoint the
          # tracer hits the US ingest API and spams 403 retries.
          LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: "true"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: |
            openwiki
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
